<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1100"
  viewBox="0 0 1600 1100"
  fill="none"
>
  <title>赤水回声｜太平古镇艺术导览地图</title>
  <desc>
    赤水回声数字声音地图底图。
    地图采用北朝上布局，包含赤水河、太平古镇、
    古习路、主要道路、街巷、河岸步行线、街区肌理、
    太平渡渡口声音水纹和指北针。
    核心点位、服务设施、路线状态与用户交互由 Vue 动态叠加。
  </desc>
  <defs>
    <!-- 页面晨雾背景渐变 -->
    <linearGradient
      id="background-gradient"
      x1="0"
      y1="0"
      x2="1600"
      y2="1100"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#FAF9F3" />
      <stop offset="0.48" stop-color="#EEF2E9" />
      <stop offset="1" stop-color="#DDE7DC" />
    </linearGradient>
    <!-- 赤水河主体渐变 -->
    <linearGradient
      id="river-gradient"
      x1="0"
      y1="80"
      x2="1600"
      y2="300"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#C3DCDA" />
      <stop offset="0.52" stop-color="#89B4B0" />
      <stop offset="1" stop-color="#5D8888" />
    </linearGradient>
    <!-- 河面反光渐变 -->
    <linearGradient
      id="river-highlight-gradient"
      x1="0"
      y1="100"
      x2="1600"
      y2="250"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        stop-color="#F4E8C7"
        stop-opacity="0.12"
      />
      <stop
        offset="0.46"
        stop-color="#F4E8C7"
        stop-opacity="0.72"
      />
      <stop
        offset="1"
        stop-color="#F4E8C7"
        stop-opacity="0.1"
      />
    </linearGradient>
    <!-- 柔雾 -->
    <filter
      id="soft-blur"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <!-- 极淡纸张纹理 -->
    <pattern
      id="paper-grain"
      width="8"
      height="8"
      patternUnits="userSpaceOnUse"
    >
      <circle
        cx="1"
        cy="2"
        r="0.5"
        fill="#AAB9AB"
        opacity="0.12"
      />
      <circle
        cx="6"
        cy="5"
        r="0.45"
        fill="#5F786B"
        opacity="0.08"
      />
    </pattern>
  </defs>
